# Builds the Fframe server image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/fframe:latest   (every push to main)
#   ghcr.io/<owner>/fframe:sha-xxxxxxx
#   ghcr.io/<owner>/fframe:1.2.3     (when a v1.2.3 tag is pushed)
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fframe
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Fframe
            org.opencontainers.image.description=Self-hosted camera-to-cloud video review (TrueNAS build)

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
